<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/codemirror.min.js"></script>
<script src="vendor/markdown.min.js"></script>
<link rel="stylesheet" href="vendor/codemirror.min.css">
<link id="hl-light" rel="stylesheet" href="vendor/github.min.css">
<link id="hl-dark" rel="stylesheet" href="vendor/github-dark.min.css" disabled>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --code-bg: #f6f8fa; --bar: #444; --bar-fg: #fff; --link: #0969da; --row: #f6f8fa;
  }
  body.dark {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
    --code-bg: #161b22; --bar: #222; --bar-fg: #eee; --link: #4493f8; --row: #151b23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  header { display: flex; align-items: center; gap: 4px; padding: 8px 16px; background: var(--bar); color: var(--bar-fg); flex-wrap: wrap; user-select: none; }
  header .title { font-weight: 600; margin-right: 12px; }
  header button, header label { background: none; border: 0; color: inherit; font: inherit; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
  header button:hover, header label:hover { background: rgba(255,255,255,.12); }
  header .file { margin-left: auto; opacity: .7; font-size: 13px; }

  main { flex: 1; display: flex; min-height: 0; }
  #editor { width: 40%; min-width: 120px; }
  /* CodeMirror editor, recoloured from the page tokens so dark mode follows */
  #editor .CodeMirror { height: 100%; font: 14px/1.6 Consolas, "Cascadia Mono", monospace; background: var(--bg); color: var(--fg); }
  #editor .CodeMirror-lines { padding: 12px 0; }
  #editor .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--border); }
  #editor .CodeMirror-linenumber { color: var(--muted); padding: 0 10px 0 8px; }
  #editor .CodeMirror-cursor { border-left-color: var(--fg); }
  #editor .CodeMirror-selected, #editor .CodeMirror-focused .CodeMirror-selected { background: rgba(68,147,248,.25); }
  #editor .CodeMirror-line::selection, #editor .CodeMirror-line > span::selection, #editor .CodeMirror-line > span > span::selection { background: rgba(68,147,248,.25); }
  #editor .cm-header { color: var(--link); font-weight: 600; }
  #editor .cm-strong { font-weight: 700; }
  #editor .cm-em { font-style: italic; }
  #editor .cm-link, #editor .cm-url, #editor .cm-string { color: var(--link); }
  #editor .cm-comment { color: #cf222e; }
  body.dark #editor .cm-comment { color: #ff7b72; }
  #editor .cm-quote, #editor .cm-hr { color: var(--muted); }
  #editor .cm-variable-2, #editor .cm-variable-3, #editor .cm-keyword { color: inherit; }
  #editor .cm-flash { background: rgba(255, 196, 0, .55); border-radius: 2px; animation: flash 3s ease-in forwards; }
  @keyframes flash { 0%, 60% { background: rgba(255, 196, 0, .55); } 100% { background: transparent; } }
  #divider { width: 6px; cursor: col-resize; background: var(--border); flex: none; }
  #divider:hover, body.resizing #divider { background: var(--link); }
  body.resizing { cursor: col-resize; user-select: none; }
  #preview { flex: 1; overflow: auto; padding: 16px 48px 64px; min-width: 120px; }
  body.preview-only #editor, body.preview-only #divider { display: none; }
  body.drag main { outline: 3px dashed var(--link); outline-offset: -8px; }

  /* rendered markdown */
  .md { max-width: 980px; line-height: 1.6; font-size: 16px; }
  .md h1, .md h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .md h1, .md h2, .md h3, .md h4 { margin: 1.4em 0 .6em; line-height: 1.25; }
  .md a { color: var(--link); }
  .md code { font-family: Consolas, monospace; font-size: 85%; background: var(--code-bg); padding: .2em .4em; border-radius: 6px; }
  .md pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow: auto; }
  .md pre code { background: none; padding: 0; font-size: 85%; }
  .md pre code.hljs { background: none; padding: 0; }
  .md blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
  .md table { border-collapse: collapse; display: block; overflow: auto; margin: 1em 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 13px; }
  .md th { font-weight: 600; }
  .md tr:nth-child(2n) { background: var(--row); }
  .md img { max-width: 100%; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .md li input[type=checkbox] { margin-right: .4em; }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    #editor { width: 100% !important; height: 40%; }
    #divider { display: none; }
    #preview { padding: 16px; }
  }
  /* PDF output: preview only, always light, full length */
  @media print {
    body, body.dark {
      --bg: #fff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
      --code-bg: #f6f8fa; --link: #0969da; --row: #f6f8fa;
    }
    html, body { height: auto; display: block; }
    header, #editor, #divider { display: none !important; }
    main, #preview { display: block; overflow: visible; padding: 0; }
    .md { max-width: none; }
    .md table { display: table; }
    .md pre, .md tr, .md img { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <span class="title">Markdown Viewer</span>
  <button id="open">Open</button>
  <button id="copy">Copy</button>
  <button id="pdf">Export PDF</button>
  <button id="reset">Reset</button>
  <label><input type="checkbox" id="sync" checked> Sync scroll</label>
  <label><input type="checkbox" id="hide-editor"> Hide editor</label>
  <label><input type="checkbox" id="dark"> Dark mode</label>
  <span class="file" id="filename">drop a .md file anywhere</span>
  <input type="file" id="picker" accept=".md,.markdown,.txt" hidden>
</header>
<main>
  <div id="editor"></div>
  <div id="divider"></div>
  <div id="preview"><article class="md" id="out"></article></div>
</main>
<script>
const SAMPLE = `# Markdown Preview

Type on the left, or **Open** / drag-drop a \`.md\` file.

| Feature | Supported |
|---|---|
| Tables | yes |
| Code highlighting | yes |
| Task lists | yes |

- [x] lightweight
- [ ] bloated

\`\`\`python
print("hello")
\`\`\`
`;
const $ = id => document.getElementById(id);
const editor = $('editor'), preview = $('preview'), out = $('out');
const cm = CodeMirror(editor, { mode: 'markdown', lineNumbers: true, lineWrapping: true });
const scroller = cm.getScrollerElement();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// pywebview injects window.pywebview.api when running as the desktop app
const api = () => window.pywebview && window.pywebview.api;
let currentName = 'document.md';

marked.setOptions({ gfm: true, breaks: false });

// Each top-level block is wrapped with the source lines it came from,
// so a click in the preview can be traced back to the markdown.
function toHtml(text) {
  const tokens = marked.lexer(text);
  let line = 0, html = '';
  for (const t of tokens) {
    const from = line;
    line += (t.raw.match(/\n/g) || []).length;
    if (t.type === 'space') continue;
    const one = [t];
    one.links = tokens.links;
    html += '<div data-from="' + from + '" data-to="' + line + '">' + marked.parser(one) + '</div>';
  }
  return html;
}

function render() {
  const text = cm.getValue();
  out.innerHTML = DOMPurify.sanitize(toHtml(text));
  out.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  store.set('md-text', text);
}

let timer;
cm.on('change', () => { clearTimeout(timer); timer = setTimeout(render, 120); });

function show(name, text) {
  cm.setValue(text);
  cm.clearHistory();
  currentName = name;
  $('filename').textContent = name;
  document.title = name + ' - Markdown Viewer';
  render();
  preview.scrollTop = scroller.scrollTop = 0;
}
function load(file) {
  const r = new FileReader();
  r.onload = () => show(file.name, r.result);
  r.readAsText(file);
}

$('open').onclick = async () => {
  if (api()) { const f = await api().open_file(); if (f) show(f.name, f.text); }
  else $('picker').click();
};
$('picker').onchange = e => e.target.files[0] && load(e.target.files[0]);

function flash(id, text) { const b = $(id), old = b.textContent; b.textContent = text; setTimeout(() => b.textContent = old, 1200); }
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(cm.getValue()); }
  catch {
    const t = document.createElement('textarea');
    t.value = cm.getValue(); document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  }
  flash('copy', 'Copied');
};
$('pdf').onclick = async () => {
  if (!api()) return window.print();
  flash('pdf', 'Saving...');
  const res = await api().export_pdf(currentName.replace(/\.[^.]+$/, '') + '.pdf');
  if (res && res.error) alert('PDF export failed: ' + res.error);
  else if (res) flash('pdf', 'Saved');
};
$('reset').onclick = () => {
  if (cm.getValue() !== SAMPLE && !confirm('Clear the editor and go back to the sample?')) return;
  show('document.md', SAMPLE);
  $('filename').textContent = 'drop a .md file anywhere';
  document.title = 'Markdown Viewer';
};

// click a word in the preview: jump to it in the editor and highlight it.
// The block gives the source lines; counting earlier copies of the word in the
// block picks the right occurrence when it appears more than once.
const WORD = /[\p{L}\p{N}_]/u;
const escRe = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let flashMark, flashTimer;
out.addEventListener('click', e => {
  if (e.target.closest('a') || !window.getSelection().isCollapsed) return;
  const at = document.caretRangeFromPoint(e.clientX, e.clientY);
  const block = at && (at.startContainer.nodeType === 3 ? at.startContainer.parentElement : at.startContainer).closest('[data-from]');
  if (!block) return;
  const from = +block.dataset.from, to = +block.dataset.to;
  const base = cm.indexFromPos({ line: from, ch: 0 });
  const src = cm.getRange({ line: from, ch: 0 }, { line: to + 1, ch: 0 });

  let word = '', hit;
  const node = at.startContainer;
  if (node.nodeType === 3) {
    const t = node.data;
    let a = at.startOffset, b = a;
    while (a > 0 && WORD.test(t[a - 1])) a--;
    while (b < t.length && WORD.test(t[b])) b++;
    word = t.slice(a, b);
    if (word) {
      const re = new RegExp('(?<![\\p{L}\\p{N}_])' + escRe(word) + '(?![\\p{L}\\p{N}_])', 'gu');
      const before = document.createRange();
      before.setStart(block, 0);
      before.setEnd(node, a);
      const nth = (before.toString().match(re) || []).length;
      const all = [...src.matchAll(re)];
      hit = all[nth] || all[0];
    }
  }
  // no word match (a symbol, an image): highlight the whole block instead
  const head = hit ? cm.posFromIndex(base + hit.index) : { line: from, ch: 0 };
  const tail = hit ? cm.posFromIndex(base + hit.index + word.length) : { line: to, ch: cm.getLine(Math.min(to, cm.lastLine())).length };

  if (flashMark) flashMark.clear();
  clearTimeout(flashTimer);
  flashMark = cm.markText(head, tail, { className: 'cm-flash' });
  flashTimer = setTimeout(() => flashMark.clear(), 3000);
  cm.setCursor(head);
  scroller.scrollTop = cm.charCoords(head, 'local').top - scroller.clientHeight / 2;
});

// drag and drop anywhere
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('drag'); }));
document.addEventListener('drop', e => e.dataTransfer.files[0] && load(e.dataTransfer.files[0]));

// Sync scroll, both ways, by source line. Every preview block knows the line it
// starts on, so the line at the top of the editor and the block at the top of
// the preview are kept together, interpolating inside a block. Editor line
// positions are only trusted near its viewport: CodeMirror estimates the height
// of wrapped lines it has not drawn, so a jump is corrected once they are drawn.
// Only the pane the user is driving (mouse over it, or typing in it) pushes its
// position to the other one, so the programmatic scroll never echoes back.
let blocks = null;  // [{line, p}]: first source line of each preview block and its y in the preview
new ResizeObserver(() => blocks = null).observe(out);
function getBlocks() {
  if (!blocks) {
    const base = preview.getBoundingClientRect().top - preview.scrollTop;
    blocks = [{ line: 0, p: 0 }];
    for (const b of out.querySelectorAll('[data-from]')) {
      const line = +b.dataset.from, p = b.getBoundingClientRect().top - base, last = blocks[blocks.length - 1];
      if (line > last.line && p > last.p) blocks.push({ line, p });
    }
    blocks.push({ line: cm.lineCount(), p: preview.scrollHeight });
  }
  return blocks;
}
function segment(key, v) {  // last block whose key <= v
  const a = getBlocks();
  let lo = 0, hi = a.length - 2;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (a[m][key] <= v) lo = m; else hi = m - 1; }
  return [a[lo], a[lo + 1]];
}
const clamp01 = x => Math.min(1, Math.max(0, x));
function lineToP(line) {
  const [s, t] = segment('line', line);
  return s.p + clamp01((line - s.line) / (t.line - s.line)) * (t.p - s.p);
}
function pToLine(y) {
  const [s, t] = segment('p', y);
  return s.line + clamp01((y - s.p) / (t.p - s.p)) * (t.line - s.line);
}
// scrollTop that puts a fractional source line at the top of the editor
function editorY(line) {
  const base = scroller.getBoundingClientRect().top - scroller.scrollTop;
  const l = Math.min(Math.floor(line), cm.lastLine());
  const top = cm.heightAtLine(l, 'window') - base;
  const next = l < cm.lastLine() ? cm.heightAtLine(l + 1, 'window') - base : top + cm.defaultTextHeight();
  return top + (line - l) * (next - top);
}
// fractional source line at the top of the editor
function editorLine() {
  const l = cm.lineAtHeight(scroller.getBoundingClientRect().top, 'window');
  const top = editorY(l), next = editorY(l + 1);
  return l + clamp01((scroller.scrollTop - top) / ((next - top) || 1));
}
const atEnd = el => el.scrollTop >= el.scrollHeight - el.clientHeight - 1;
function syncPreview() {
  preview.scrollTop = atEnd(scroller) ? preview.scrollHeight : lineToP(editorLine());
}
function syncEditor(pass = 0) {
  const y = atEnd(preview) ? scroller.scrollHeight : editorY(pToLine(preview.scrollTop));
  if (Math.abs(scroller.scrollTop - y) < 1) return;
  scroller.scrollTop = y;
  if (pass < 3) setTimeout(() => driver === preview && syncEditor(pass + 1), 30);
}
let driver = scroller;
cm.on('focus', () => driver = scroller);
preview.addEventListener('focus', () => driver = preview);
[scroller, preview].forEach(el => {
  el.addEventListener('mouseenter', () => driver = el);
  el.addEventListener('scroll', () => {
    if (!$('sync').checked || el !== driver) return;
    if (el === scroller) syncPreview();
    else syncEditor();
  });
});

// draggable divider
$('divider').addEventListener('mousedown', e => {
  e.preventDefault();
  document.body.classList.add('resizing');
  const move = ev => {
    const pct = Math.min(85, Math.max(10, ev.clientX / window.innerWidth * 100));
    editor.style.width = pct + '%';
    cm.refresh();
  };
  const up = () => {
    document.body.classList.remove('resizing');
    store.set('md-split', editor.style.width);
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

// toggles, remembered between sessions
function setDark(on) {
  document.body.classList.toggle('dark', on);
  $('hl-dark').disabled = !on; $('hl-light').disabled = on;
}
$('dark').onchange = e => { setDark(e.target.checked); store.set('md-dark', e.target.checked ? '1' : ''); };
$('hide-editor').onchange = e => { document.body.classList.toggle('preview-only', e.target.checked); cm.refresh(); };

const savedDark = store.get('md-dark');
const dark = savedDark === null ? true : !!savedDark;  // dark by default until the user picks
$('dark').checked = dark; setDark(dark);
if (store.get('md-split')) editor.style.width = store.get('md-split');
cm.setValue(store.get('md-text') ?? SAMPLE);
cm.clearHistory();
render();

// a file passed on the command line ("Open with", double-click) wins over the autosave
window.addEventListener('pywebviewready', async () => {
  const f = await api().initial_file();
  if (f) show(f.name, f.text);
});
</script>
</body>
</html>
